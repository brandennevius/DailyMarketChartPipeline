name: Build Market Chart Packet

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Completed US session date (YYYY-MM-DD)
        required: true
        type: string
      tickers:
        description: Comma-separated verified manifest tickers (manual test mode)
        required: true
        type: string
      feed:
        description: Alpaca market-data feed
        required: true
        default: iex
        type: choice
        options: [iex, sip]
  push:
    branches: [main]
    paths:
      - 'requests/20*.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DATE: ${{ inputs.session_date }}
          MANUAL_TICKERS: ${{ inputs.tickers }}
          MANUAL_FEED: ${{ inputs.feed }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['GITHUB_OUTPUT'])
          if os.environ['EVENT_NAME'] == 'push':
              changed = subprocess.check_output(
                  ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'], text=True
              ).splitlines()
              candidates = sorted(p for p in changed if p.startswith('requests/20') and p.endswith('.json'))
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one request manifest in commit; found {candidates}')
              manifest = candidates[0]
              payload = json.loads(Path(manifest).read_text())
              session_date = payload['session_date']
              lines = [f'mode=manifest', f'manifest={manifest}', f'session_date={session_date}']
          else:
              lines = [
                  'mode=manual',
                  f"session_date={os.environ['MANUAL_DATE']}",
                  f"tickers={os.environ['MANUAL_TICKERS']}",
                  f"feed={os.environ.get('MANUAL_FEED') or 'iex'}",
              ]
          with out.open('a') as f:
              f.write('\n'.join(lines) + '\n')
          PY
      - name: Build chart packet from manifest
        if: steps.request.outputs.mode == 'manifest'
        run: |
          python -m market_chart_pipeline.cli \
            --manifest "${{ steps.request.outputs.manifest }}" \
            --output-dir output
      - name: Build chart packet manually
        if: steps.request.outputs.mode == 'manual'
        run: |
          python -m market_chart_pipeline.cli \
            --session-date "${{ steps.request.outputs.session_date }}" \
            --tickers "${{ steps.request.outputs.tickers }}" \
            --feed "${{ steps.request.outputs.feed }}" \
            --output-dir output
      - name: Upload packet
        uses: actions/upload-artifact@v4
        with:
          name: market-chart-packet-${{ steps.request.outputs.session_date }}
          path: output/${{ steps.request.outputs.session_date }}/
          if-no-files-found: error
          retention-days: 30
