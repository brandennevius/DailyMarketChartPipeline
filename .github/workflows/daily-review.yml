name: Daily Market & Portfolio Review

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Completed US session date (YYYY-MM-DD)
        required: false
        type: string
      review_run_id:
        description: Exact TradingDashboard review run ID (uses dashboard worker inputs instead of Gmail)
        required: false
        type: string
      attempt:
        description: TradingDashboard review attempt
        required: false
        type: string
      marketsurge_pdf_sha256:
        description: Frozen MarketSurge PDF SHA-256
        required: false
        type: string
      snapshot_json_sha256:
        description: Frozen portfolio snapshot JSON SHA-256
        required: false
        type: string
      snapshot_markdown_sha256:
        description: Frozen portfolio snapshot Markdown SHA-256
        required: false
        type: string
      market_gauge_json_sha256:
        description: Frozen exact-session Dashboard Market Gauge JSON SHA-256
        required: false
        type: string
      worker_input_url:
        description: Authenticated TradingDashboard worker-input endpoint
        required: false
        type: string
      worker_callback_url:
        description: TradingDashboard callback endpoint
        required: false
        type: string
      retry_prepacket_failure:
        description: Explicitly retry only a terminal failure that produced no packet hash
        required: false
        default: false
        type: boolean
      policy_replay:
        description: Rebuild a terminal session with current policy without replacing its receipt
        required: false
        default: false
        type: boolean
      dry_run:
        description: Build and upload the review without email delivery
        required: false
        default: false
        type: boolean
  schedule:
    # Source snapshots and the MarketSurge scan arrive after the close. This is
    # 10:30 PM EDT / 9:30 PM EST; exact-session validation still gates the run.
    - cron: '30 2 * * 2-6'

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-market-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DAILY_REVIEW_RECIPIENT: ${{ secrets.DAILY_REVIEW_RECIPIENT }}
      CHART_PACKET_RECIPIENT: ${{ secrets.CHART_PACKET_RECIPIENT }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      DASHBOARD_WORKER_SECRET: ${{ secrets.DASHBOARD_WORKER_SECRET }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MARKET_REVIEW_MODEL: ${{ vars.OPENAI_MARKET_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Resolve session date
        id: session
        if: inputs.review_run_id == ''
        env:
          MANUAL_DATE: ${{ inputs.session_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta

          session = os.environ.get('MANUAL_DATE', '').strip()
          if not session:
              day = date.today() - timedelta(days=1)
              while day.weekday() >= 5:
                  day -= timedelta(days=1)
              session = day.isoformat()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'session_date={session}\n')
          PY
      - name: Check terminal processed state
        id: processed
        if: inputs.review_run_id == ''
        env:
          SESSION_DATE: ${{ steps.session.outputs.session_date }}
          RETRY_PREPACKET_FAILURE: ${{ inputs.retry_prepacket_failure }}
          POLICY_REPLAY: ${{ inputs.policy_replay }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path('processed', f'daily-review-{os.environ["SESSION_DATE"]}.json')
          state = json.loads(receipt.read_text()) if receipt.exists() else {}
          skip = state.get('terminal') is True
          retry = os.environ.get('RETRY_PREPACKET_FAILURE', '').lower() == 'true'
          policy_replay = os.environ.get('POLICY_REPLAY', '').lower() == 'true'
          retryable = state.get('audit_status') == 'failed' and state.get('packet_hash') is None
          if retry and retryable:
              skip = False
          if policy_replay:
              skip = False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'skip={str(skip).lower()}\n')
          PY
      - name: Acquire exact-session sources
        id: sources
        if: inputs.review_run_id == '' && steps.processed.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m market_chart_pipeline.source_acquisition \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir source-input \
            --repository "${{ github.repository }}" \
            --outputs-json source-outputs.json
      - name: Run strict deterministic review
        id: deterministic
        if: inputs.review_run_id == '' && steps.processed.outputs.skip != 'true' && steps.sources.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, subprocess
          source = json.load(open('source-outputs.json'))
          session = '${{ steps.session.outputs.session_date }}'
          subprocess.run([
              'python', '-m', 'market_chart_pipeline.daily_review',
              '--date', session,
              '--session-date', session,
              '--mode', 'read-only',
              '--portfolio', source['portfolio'],
              '--chart-packet-dir', source['chart_packet_dir'],
              '--source-manifest', source['manifest'],
              '--audit-profile', 'strict-core',
              '--output-dir', 'reports/market',
          ], check=True)
          PY
      - name: Deliver validated review
        id: delivery
        if: inputs.review_run_id == '' && steps.processed.outputs.skip != 'true' && steps.deterministic.outcome == 'success' && inputs.dry_run != true
        continue-on-error: true
        run: |
          python -m market_chart_pipeline.review_mailer \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir reports/market \
            --status-json delivery-status.json
      - name: Deliver fail-closed notice
        id: failure_notice
        if: inputs.review_run_id == '' && steps.processed.outputs.skip != 'true' && inputs.dry_run != true && (steps.sources.outcome == 'failure' || steps.deterministic.outcome == 'failure')
        continue-on-error: true
        run: |
          python -m market_chart_pipeline.review_mailer \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir reports/market \
            --status-json delivery-status.json \
            --failure-error "source_acquisition=${{ steps.sources.outcome }}; deterministic_audit=${{ steps.deterministic.outcome }}"
      - name: Record terminal processed state
        id: state
        if: always() && inputs.review_run_id == '' && steps.processed.outputs.skip != 'true'
        env:
          SESSION_DATE: ${{ steps.session.outputs.session_date }}
          POLICY_REPLAY: ${{ inputs.policy_replay }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
          REVIEW_OUTCOME: ${{ steps.deterministic.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          FAILURE_NOTICE_OUTCOME: ${{ steps.failure_notice.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from market_chart_pipeline.delivery_state import write_processed_state

          session = os.environ['SESSION_DATE']
          packet_path = Path('reports/market') / session / f'{session}-market-review.json'
          packet = json.loads(packet_path.read_text()) if packet_path.exists() else {}
          status_path = Path('delivery-status.json')
          if status_path.exists():
              delivery = json.loads(status_path.read_text())
          elif os.environ.get('DRY_RUN', '').lower() == 'true':
              delivery = {'status': 'NOT_REQUESTED', 'error': None}
          else:
              delivery = {
                  'status': 'FAILED',
                  'error': 'delivery step did not write delivery-status.json',
              }
          delivery.update({
              'review_delivery_step': os.environ['DELIVERY_OUTCOME'],
              'failure_notice_step': os.environ['FAILURE_NOTICE_OUTCOME'],
          })
          if os.environ.get('POLICY_REPLAY', '').lower() == 'true':
              receipt = Path('processed', 'replays', f'daily-review-{session}-replay-{os.environ["RUN_ID"]}.json')
          else:
              receipt = Path('processed') / f'daily-review-{session}.json'
          write_processed_state(
              receipt,
              manifest='source-input/source-manifest.json',
              session_date=session,
              packet_hash=packet.get('packet_sha256'),
              audit_status='pass' if os.environ['REVIEW_OUTCOME'] == 'success' else 'failed',
              delivery=delivery,
          )
          Path('processed-state-path.txt').write_text(receipt.as_posix())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'receipt={receipt.as_posix()}\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$(cat processed-state-path.txt)"
          git commit -m "Record daily review state: ${{ steps.session.outputs.session_date }}"
          git pull --rebase origin main
          git push
      - name: Upload source, report, and receipt artifacts
        if: always() && inputs.review_run_id == '' && steps.processed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-review-${{ steps.session.outputs.session_date }}
          path: |
            source-input/source-manifest.json
            source-outputs.json
            reports/market/${{ steps.session.outputs.session_date }}/
            ${{ steps.state.outputs.receipt }}
            delivery-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce final outcome
        if: inputs.review_run_id == '' && steps.processed.outputs.skip != 'true'
        env:
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
          REVIEW_OUTCOME: ${{ steps.deterministic.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test "$SOURCE_OUTCOME" = success
          test "$REVIEW_OUTCOME" = success
          if [ "$DRY_RUN" != true ]; then test "$DELIVERY_OUTCOME" = success; fi

      - name: Check dashboard terminal processed state
        id: dashboard_processed
        if: inputs.review_run_id != ''
        env:
          DASHBOARD_RUN_ID: ${{ inputs.review_run_id }}
          DASHBOARD_ATTEMPT: ${{ inputs.attempt }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          run_id = os.environ['DASHBOARD_RUN_ID']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]{0,127}', run_id):
              raise SystemExit('dashboard_run_id contains unsupported characters')
          attempt = os.environ['DASHBOARD_ATTEMPT']
          if not re.fullmatch(r'[1-9][0-9]*', attempt):
              raise SystemExit('attempt must be a positive integer')
          receipt = Path('processed', 'dashboard', f'daily-review-{run_id}-attempt-{attempt}.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"skip={str(receipt.exists()).lower()}\n")
              if receipt.exists():
                  out.write(f"reason=terminal dashboard run already processed: {receipt}\n")
          PY
      - name: Install dashboard OCR system dependencies
        if: inputs.review_run_id != '' && steps.dashboard_processed.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Run dashboard review orchestrator
        id: dashboard
        if: inputs.review_run_id != '' && steps.dashboard_processed.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python -m market_chart_pipeline.dashboard_review \
            --review-run-id "${{ inputs.review_run_id }}" \
            --session-date "${{ inputs.session_date }}" \
            --attempt "${{ inputs.attempt }}" \
            --marketsurge-pdf-sha256 "${{ inputs.marketsurge_pdf_sha256 }}" \
            --snapshot-json-sha256 "${{ inputs.snapshot_json_sha256 }}" \
            --snapshot-markdown-sha256 "${{ inputs.snapshot_markdown_sha256 }}" \
            --market-gauge-json-sha256 "${{ inputs.market_gauge_json_sha256 }}" \
            --worker-input-url "${{ inputs.worker_input_url }}" \
            --worker-callback-url "${{ inputs.worker_callback_url }}" \
            --work-dir dashboard-input \
            --output-dir reports/market \
            --status-json dashboard-status.json
      - name: Record dashboard terminal state
        id: dashboard_state
        if: always() && inputs.review_run_id != '' && steps.dashboard_processed.outputs.skip != 'true'
        env:
          DASHBOARD_RUN_ID: ${{ inputs.review_run_id }}
          DASHBOARD_ATTEMPT: ${{ inputs.attempt }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from market_chart_pipeline.delivery_state import write_processed_state

          status_path = Path('dashboard-status.json')
          status = json.loads(status_path.read_text()) if status_path.exists() else {
              'run_id': os.environ['DASHBOARD_RUN_ID'],
              'status': 'FAILED',
              'error': 'dashboard orchestrator did not write status',
          }
          if status.get('status') == 'NEEDS_REVIEW':
              Path('dashboard-state-path.txt').write_text('')
              raise SystemExit(0)
          receipt = Path(
              'processed', 'dashboard',
              f"daily-review-{os.environ['DASHBOARD_RUN_ID']}-attempt-{os.environ['DASHBOARD_ATTEMPT']}.json",
          )
          delivery = status.get('delivery') or {'status': 'NOT_REQUESTED', 'error': None}
          write_processed_state(
              receipt,
              manifest=f"dashboard-run:{os.environ['DASHBOARD_RUN_ID']}",
              session_date=status.get('session_date') or 'unknown',
              packet_hash=status.get('packet_sha256'),
              audit_status=status.get('audit_status') or 'failed',
              delivery=delivery,
          )
          Path('dashboard-state-path.txt').write_text(receipt.as_posix())
          PY
          if [ -s dashboard-state-path.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$(cat dashboard-state-path.txt)"
            git commit -m "Record dashboard daily review state: ${{ inputs.review_run_id }}"
            git pull --rebase origin main
            git push
          fi
      - name: Upload dashboard review evidence
        if: always() && inputs.review_run_id != '' && steps.dashboard_processed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-daily-market-review-${{ inputs.review_run_id }}
          path: |
            dashboard-status.json
            dashboard-input/chart-request-manifest.json
            dashboard-input/ocr-evidence/
            dashboard-input/source-manifest.json
            reports/market/
            processed/dashboard/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dashboard outcome
        if: inputs.review_run_id != '' && steps.dashboard_processed.outputs.skip != 'true'
        env:
          DASHBOARD_OUTCOME: ${{ steps.dashboard.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('dashboard-status.json').read_text())
          if status.get('status') not in {'COMPLETED', 'NEEDS_REVIEW'}:
              raise SystemExit(f"dashboard review failed: {status}")
          if status.get('status') == 'COMPLETED' and os.environ['DASHBOARD_OUTCOME'] != 'success':
              raise SystemExit('dashboard step did not complete successfully')
          if status.get('status') == 'COMPLETED' and status.get('delivery', {}).get('status') != 'SENT':
              raise SystemExit(f"dashboard report completed but delivery failed: {status.get('delivery')}")
          PY
