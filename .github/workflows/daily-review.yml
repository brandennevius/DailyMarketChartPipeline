name: Daily Market & Portfolio Review

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Completed US session date (YYYY-MM-DD)
        required: true
        type: string
      retry_prepacket_failure:
        description: Explicitly retry only a terminal failure that produced no packet hash
        required: false
        default: false
        type: boolean
      policy_replay:
        description: Rebuild a terminal session with current policy without replacing its receipt
        required: false
        default: false
        type: boolean
      dry_run:
        description: Build and upload the review without email delivery
        required: false
        default: false
        type: boolean
  schedule:
    # Source snapshots and the MarketSurge scan arrive after the close. This is
    # 10:30 PM EDT / 9:30 PM EST; exact-session validation still gates the run.
    - cron: '30 2 * * 2-6'

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-market-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DAILY_REVIEW_RECIPIENT: ${{ secrets.DAILY_REVIEW_RECIPIENT }}
      CHART_PACKET_RECIPIENT: ${{ secrets.CHART_PACKET_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Resolve session date
        id: session
        env:
          MANUAL_DATE: ${{ inputs.session_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta

          session = os.environ.get('MANUAL_DATE', '').strip()
          if not session:
              day = date.today() - timedelta(days=1)
              while day.weekday() >= 5:
                  day -= timedelta(days=1)
              session = day.isoformat()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'session_date={session}\n')
          PY
      - name: Check terminal processed state
        id: processed
        env:
          SESSION_DATE: ${{ steps.session.outputs.session_date }}
          RETRY_PREPACKET_FAILURE: ${{ inputs.retry_prepacket_failure }}
          POLICY_REPLAY: ${{ inputs.policy_replay }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path('processed', f'daily-review-{os.environ["SESSION_DATE"]}.json')
          state = json.loads(receipt.read_text()) if receipt.exists() else {}
          skip = state.get('terminal') is True
          retry = os.environ.get('RETRY_PREPACKET_FAILURE', '').lower() == 'true'
          policy_replay = os.environ.get('POLICY_REPLAY', '').lower() == 'true'
          retryable = state.get('audit_status') == 'failed' and state.get('packet_hash') is None
          if retry and retryable:
              skip = False
          if policy_replay:
              skip = False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'skip={str(skip).lower()}\n')
          PY
      - name: Acquire exact-session sources
        id: sources
        if: steps.processed.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m market_chart_pipeline.source_acquisition \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir source-input \
            --repository "${{ github.repository }}" \
            --outputs-json source-outputs.json
      - name: Run strict deterministic review
        id: deterministic
        if: steps.processed.outputs.skip != 'true' && steps.sources.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, subprocess
          source = json.load(open('source-outputs.json'))
          session = '${{ steps.session.outputs.session_date }}'
          subprocess.run([
              'python', '-m', 'market_chart_pipeline.daily_review',
              '--date', session,
              '--session-date', session,
              '--mode', 'read-only',
              '--portfolio', source['portfolio'],
              '--chart-packet-dir', source['chart_packet_dir'],
              '--source-manifest', source['manifest'],
              '--audit-profile', 'strict-core',
              '--output-dir', 'reports/market',
          ], check=True)
          PY
      - name: Deliver validated review
        id: delivery
        if: steps.processed.outputs.skip != 'true' && steps.deterministic.outcome == 'success' && inputs.dry_run != true
        continue-on-error: true
        run: |
          python -m market_chart_pipeline.review_mailer \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir reports/market \
            --status-json delivery-status.json
      - name: Deliver fail-closed notice
        id: failure_notice
        if: steps.processed.outputs.skip != 'true' && inputs.dry_run != true && (steps.sources.outcome == 'failure' || steps.deterministic.outcome == 'failure')
        continue-on-error: true
        run: |
          python -m market_chart_pipeline.review_mailer \
            --session-date "${{ steps.session.outputs.session_date }}" \
            --output-dir reports/market \
            --status-json delivery-status.json \
            --failure-error "source_acquisition=${{ steps.sources.outcome }}; deterministic_audit=${{ steps.deterministic.outcome }}"
      - name: Record terminal processed state
        id: state
        if: always() && steps.processed.outputs.skip != 'true'
        env:
          SESSION_DATE: ${{ steps.session.outputs.session_date }}
          POLICY_REPLAY: ${{ inputs.policy_replay }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
          REVIEW_OUTCOME: ${{ steps.deterministic.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          FAILURE_NOTICE_OUTCOME: ${{ steps.failure_notice.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from market_chart_pipeline.delivery_state import write_processed_state

          session = os.environ['SESSION_DATE']
          packet_path = Path('reports/market') / session / f'{session}-market-review.json'
          packet = json.loads(packet_path.read_text()) if packet_path.exists() else {}
          status_path = Path('delivery-status.json')
          if status_path.exists():
              delivery = json.loads(status_path.read_text())
          elif os.environ.get('DRY_RUN', '').lower() == 'true':
              delivery = {'status': 'NOT_REQUESTED', 'error': None}
          else:
              delivery = {
                  'status': 'FAILED',
                  'error': 'delivery step did not write delivery-status.json',
              }
          delivery.update({
              'review_delivery_step': os.environ['DELIVERY_OUTCOME'],
              'failure_notice_step': os.environ['FAILURE_NOTICE_OUTCOME'],
          })
          if os.environ.get('POLICY_REPLAY', '').lower() == 'true':
              receipt = Path('processed', 'replays', f'daily-review-{session}-replay-{os.environ["RUN_ID"]}.json')
          else:
              receipt = Path('processed') / f'daily-review-{session}.json'
          write_processed_state(
              receipt,
              manifest='source-input/source-manifest.json',
              session_date=session,
              packet_hash=packet.get('packet_sha256'),
              audit_status='pass' if os.environ['REVIEW_OUTCOME'] == 'success' else 'failed',
              delivery=delivery,
          )
          Path('processed-state-path.txt').write_text(receipt.as_posix())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'receipt={receipt.as_posix()}\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$(cat processed-state-path.txt)"
          git commit -m "Record daily review state: ${{ steps.session.outputs.session_date }}"
          git pull --rebase origin main
          git push
      - name: Upload source, report, and receipt artifacts
        if: always() && steps.processed.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-review-${{ steps.session.outputs.session_date }}
          path: |
            source-input/source-manifest.json
            source-outputs.json
            reports/market/${{ steps.session.outputs.session_date }}/
            ${{ steps.state.outputs.receipt }}
            delivery-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce final outcome
        if: steps.processed.outputs.skip != 'true'
        env:
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
          REVIEW_OUTCOME: ${{ steps.deterministic.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test "$SOURCE_OUTCOME" = success
          test "$REVIEW_OUTCOME" = success
          if [ "$DRY_RUN" != true ]; then test "$DELIVERY_OUTCOME" = success; fi
